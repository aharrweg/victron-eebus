name: Build EEBUS Cerbo Binary

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile for Venus OS (ARMv7)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Static Binary
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: 7
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o eebus-cerbo .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eebus-cerbo-binary
          path: eebus-cerbo
          retention-days: 7
